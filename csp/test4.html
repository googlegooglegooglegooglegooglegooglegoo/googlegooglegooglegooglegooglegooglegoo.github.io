<a href="javascript:run();" style="font-size: 100px;">Open</a>

<script>
    function run(){
        var script = setTimeout(() => {
            window.open ('about:blank')
        },250);

        setTimeout(() => {
            window.open ('https://google.com')  
        }, 2500)

        setTimeout(() => {
            window.open("javascript:" + script);
        }, 5000);
    }
</script>
