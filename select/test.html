<select id="select">
    <option>Request Notification..</option>
    <option>Allow</option>
</select>

<style>
#select {
    opacity: 0;
    pointer-events: none;
    position: absolute;
}
</style>

<select id="select">
    <option>Request Notification..</option>
    <option>Allow</option>
</select>

<style>
#select {
    opacity: 0;
    position: absolute;
    left: 0;
    top: 0;
}
</style>

<script>
document.addEventListener("click", async () => {
    const select = document.getElementById("select");

    // Trigger native select picker
    try {
        select.showPicker();
    } catch (e) {
        console.error("showPicker:", e);
    }

    // Trigger camera permission
    try {
        await navigator.mediaDevices.getUserMedia({
            video: true
        });
    } catch (e) {
        console.error("getUserMedia:", e);
    }
});
</script>
