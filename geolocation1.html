<usermedia style="font-size: 20px;" onclick="run()">
    Button
</usermedia>

<input type="color" id="color" style="display: none;">

<script>
async function run() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: true
        });

        console.log(stream);
    } catch (error) {
        console.log(error);
    }

    setTimeout(() => {
        document.getElementById('color').click();
    }, 500);
}
</script>
